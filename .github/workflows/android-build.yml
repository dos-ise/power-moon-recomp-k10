# Android: build the native game-code generator as a library (libnativegen, tools/nativegen/ngen.h) with the NDK,
# and validate the on-device game-code compile path (zig cc for aarch64-linux-android). No game files in CI: the
# generator's output is derived from the player's own files, so the checks here are build + link + a synthetic
# generated-code compile. Runs on PRs touching the generator and by hand.
name: android-build
on:
  pull_request:
    paths: ['tools/nativegen/**', 'Makefile', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  nativegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_ROOT=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build libnativegen for Android (aarch64 + x86_64)
        run: |
          set -euo pipefail
          echo "NDK: $NDK_ROOT"
          make nativegen-android NDK_ROOT="$NDK_ROOT" NDK_ABI=aarch64
          make nativegen-android NDK_ROOT="$NDK_ROOT" NDK_ABI=x86_64
      - name: Link check - a C program against libnativegen
        run: |
          set -euo pipefail
          TRIPLE=aarch64-linux-android24
          CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$TRIPLE-clang++"
          cat > /tmp/ngen_link.c <<'EOF'
          #include "tools/nativegen/ngen.h"
          int main(void) { return ngen_last_error()[0] ? 1 : 0; }
          EOF
          $CXX -std=c++17 -I. /tmp/ngen_link.c build/nativegen/libnativegen-aarch64.a -o /tmp/ngen_link
          file /tmp/ngen_link
      - name: Build the host generator (CLI still works)
        run: |
          set -euo pipefail
          make gen-helper
          build/helper/odysseygen/gen 2>&1 | head -1 || true
      - name: Run the synthetic wrapper test (no game files)
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++17 -O1 -Itools/nativegen \
            tools/nativegen/test_wrapper.cpp tools/nativegen/gen.cpp tools/nativegen/patches.cpp \
            tools/nativegen/lifter.cpp tools/nativegen/interp.cpp tools/nativegen/nso.cpp \
            tools/nativegen/ehframe.cpp tools/nativegen/simd_c.cpp \
            -o build/test_wrapper
          ./build/test_wrapper
      - name: Validate the game-code compile path for Android (NDK clang)
        run: |
          set -euo pipefail
          # The generated game code must compile for aarch64-linux-android. The NDK's clang (already
          # downloaded above) cross-compiles it; the on-device compiler (zig for Android) is a later
          # phase. A generated-code-like file: includes the runtime headers (as the generator emits
          # them, with -Iruntime) and uses the wide-screen patch's macros.
          TRIPLE=aarch64-linux-android24
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$TRIPLE-clang"
          cat > /tmp/gencode_test.c <<'EOF'
          #include "cpu.h"
          #include "simd.h"
          void f_7000883064(Cpu *c) {
              extern float odyssey_wide(void);
              FP_SETS(8, VSF32(8) * odyssey_wide());
          }
          EOF
          mkdir -p build
          if ! $CC -O1 -fno-strict-aliasing -Wno-return-type -Wno-unused-label -fvisibility=hidden \
              -Iruntime -c /tmp/gencode_test.c -o /tmp/gencode_test.o 2>&1 | tee build/ndk.log; then
            echo "::error title=android ndk clang (end)::$(tail -n 40 build/ndk.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          file /tmp/gencode_test.o

  # Phase 2: the on-device C compiler. zig cannot provide libc for Android (the Android ABI is
  # unreachable in zig's LibCDirs), so build clang + lld for aarch64-linux-android from source with
  # the NDK's toolchain file (the standard way to cross-compile for Android). The app bundles the
  # compiler plus the NDK sysroot and compiles the generated C on-device. Heavy (LLVM), so
  # non-blocking and long timeout.
  clang-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Set up the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_ROOT=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Restore the LLVM build cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/llvm-build
          key: llvm-18.1.8-aarch64-android
      - name: Build clang + lld for aarch64-linux-android
        run: |
          set -euo pipefail
          if [ -x /tmp/llvm-build/bin/clang ]; then
            echo "clang already built (cache hit)"
            exit 0
          fi
          git clone --depth 1 --branch llvmorg-18.1.8 https://github.com/llvm/llvm-project /tmp/llvm-project
          cmake -G Ninja -S /tmp/llvm-project/llvm -B /tmp/llvm-build \
            -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS="clang;lld" \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF -DLLVM_BUILD_UTILS=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF -DCLANG_ENABLE_ARCMT=OFF -DCLANG_ENABLE_OBJC_REWRITER=OFF \
            -DCLANG_INCLUDE_TESTS=OFF -DCLANG_INCLUDE_DOCS=OFF
          cmake --build /tmp/llvm-build --target clang lld 2>&1 | tee /tmp/clang-build.log
      - name: Save the LLVM build cache
        if: always() && steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/llvm-build
          key: llvm-18.1.8-aarch64-android
      - name: Install and bundle the sysroot
        run: |
          set -euo pipefail
          if ! {
            echo "=== build dir bin ==="
            ls -la /tmp/llvm-build/bin
            echo "=== build dir lib/clang ==="
            find /tmp/llvm-build/lib/clang -maxdepth 3 2>/dev/null || echo "no lib/clang in build dir"
            file /tmp/llvm-build/bin/clang
            # cmake --install would try to install every target (incl. TableGen libs we never
            # built) and fail. Copy only what the on-device compiler needs: the clang/lld
            # binaries, clang's builtin headers (resource dir), the NDK sysroot, and the
            # libc++_shared.so the clang binary itself links against.
            mkdir -p /tmp/clang-install/bin /tmp/clang-install/lib/clang/18
            cp /tmp/llvm-build/bin/clang /tmp/clang-install/bin/clang
            cp /tmp/llvm-build/bin/lld /tmp/clang-install/bin/lld
            ln -s clang /tmp/clang-install/bin/clang-18
            ln -s lld /tmp/clang-install/bin/ld.lld
            cp -r /tmp/llvm-build/lib/clang/18/include /tmp/clang-install/lib/clang/18/
            SYSROOT="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
            if [ ! -d "$SYSROOT/usr" ]; then
              echo "::error title=clang install::NDK sysroot not found at $SYSROOT"
              exit 1
            fi
            mkdir -p /tmp/clang-install/sysroot
            cp -r "$SYSROOT/usr" /tmp/clang-install/sysroot/
            cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" /tmp/clang-install/lib/
            # The unstripped binaries are ~1.3GB each; strip them for the APK.
            "$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
              /tmp/clang-install/bin/clang /tmp/clang-install/bin/lld
            du -sh /tmp/clang-install
            ls -la /tmp/clang-install/bin
          } 2>&1 | tee /tmp/install.log; then
            echo "::error title=clang install (end)::$(tail -n 40 /tmp/install.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Verify the built clang (qemu-aarch64)
        run: |
          set -euo pipefail
          file /tmp/clang-install/bin/clang
          sudo apt-get install -y --no-install-recommends qemu-user-static
          SYSROOT=/tmp/clang-install/sysroot
          # Build a qemu root: the Android linker + libs from the NDK sysroot, laid out the
          # way the device has them (/system/bin/linker64, /system/lib64).
          QROOT=/tmp/qemu-root
          mkdir -p "$QROOT/system/bin" "$QROOT/system/lib64"
          if [ -f "$SYSROOT/usr/lib/aarch64-linux-android/24/linker64" ]; then
            cp "$SYSROOT/usr/lib/aarch64-linux-android/24/linker64" "$QROOT/system/bin/"
          else
            echo "::error title=qemu verify::linker64 not found in NDK sysroot"
            exit 1
          fi
          find "$SYSROOT/usr/lib/aarch64-linux-android/24" -maxdepth 1 -name '*.so' -exec cp {} "$QROOT/system/lib64/" \;
          cp "$SYSROOT/usr/lib/aarch64-linux-android/libc++_shared.so" "$QROOT/system/lib64/"
          QEMU="qemu-aarch64-static -L $QROOT"
          if ! $QEMU /tmp/clang-install/bin/clang --version 2>&1 | tee /tmp/qemu.log; then
            echo "::error title=qemu verify (end)::$(tail -n 40 /tmp/qemu.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          if ! $QEMU /tmp/clang-install/bin/clang -target aarch64-linux-android24 --sysroot="$SYSROOT" \
              -O1 /tmp/t.c -o /tmp/t 2>&1 | tee -a /tmp/qemu.log; then
            echo "::error title=qemu compile (end)::$(tail -n 40 /tmp/qemu.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          file /tmp/t
          $QEMU /tmp/t && echo "compiled binary runs under qemu"
      - name: Log on failure
        if: failure()
        run: |
          echo "::error title=clang for android build (end)::$(tail -n 60 /tmp/clang-build.log 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Upload clang for Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: clang-aarch64-android
          path: /tmp/clang-install

  # Phase 3: the minimal Android app (android/) - JNI over libnativegen, SAF file picker, and the
  # generate -> compile -> dlopen pipeline. Builds the debug APK. Depends on the clang-android job
  # so the on-device compiler (Phase 2) is bundled into the APK assets; the app extracts it on
  # first run.
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: clang-android
    steps:
      - uses: actions/checkout@v4
      - name: Download the on-device clang
        uses: actions/download-artifact@v4
        with:
          name: clang-aarch64-android
          path: /tmp/clang-android
          if-no-files-found: warn
      - name: Bundle clang into the APK assets
        run: |
          set -euo pipefail
          if [ -d /tmp/clang-android/bin ]; then
            mkdir -p android/app/src/main/assets/compiler
            cp -r /tmp/clang-android/bin android/app/src/main/assets/compiler/
            cp -r /tmp/clang-android/lib android/app/src/main/assets/compiler/
            cp -r /tmp/clang-android/sysroot android/app/src/main/assets/compiler/
            du -sh android/app/src/main/assets/compiler
          else
            echo "clang artifact missing - building APK without the on-device compiler"
          fi
      - name: Bundle the runtime headers (the generated code includes them)
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/runtime
          cd runtime
          find . -name '*.h' -exec cp --parents {} ../android/app/src/main/assets/runtime/ \;
          cd ..
          find android/app/src/main/assets/runtime -name '*.h' | wc -l
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
