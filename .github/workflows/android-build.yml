# Android: build the native game-code generator as a library (libnativegen, tools/nativegen/ngen.h) with the NDK,
# and validate the on-device game-code compile path (zig cc for aarch64-linux-android). No game files in CI: the
# generator's output is derived from the player's own files, so the checks here are build + link + a synthetic
# generated-code compile. Runs on PRs touching the generator and by hand.
name: android-build
on:
  pull_request:
    paths: ['tools/nativegen/**', 'Makefile', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write

jobs:
  nativegen:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "NDK_ROOT=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Build libnativegen for Android (aarch64 + x86_64)
        run: |
          set -euo pipefail
          echo "NDK: $NDK_ROOT"
          make nativegen-android NDK_ROOT="$NDK_ROOT" NDK_ABI=aarch64
          make nativegen-android NDK_ROOT="$NDK_ROOT" NDK_ABI=x86_64
      - name: Link check - a C program against libnativegen
        run: |
          set -euo pipefail
          TRIPLE=aarch64-linux-android24
          CXX="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$TRIPLE-clang++"
          cat > /tmp/ngen_link.c <<'EOF'
          #include "tools/nativegen/ngen.h"
          int main(void) { return ngen_last_error()[0] ? 1 : 0; }
          EOF
          $CXX -std=c++17 -I. /tmp/ngen_link.c build/nativegen/libnativegen-aarch64.a -o /tmp/ngen_link
          file /tmp/ngen_link
      - name: Build the host generator (CLI still works)
        run: |
          set -euo pipefail
          make gen-helper
          build/helper/odysseygen/gen 2>&1 | head -1 || true
      - name: Run the synthetic wrapper test (no game files)
        run: |
          set -euo pipefail
          mkdir -p build
          g++ -std=c++17 -O1 -Itools/nativegen \
            tools/nativegen/test_wrapper.cpp tools/nativegen/gen.cpp tools/nativegen/patches.cpp \
            tools/nativegen/lifter.cpp tools/nativegen/interp.cpp tools/nativegen/nso.cpp \
            tools/nativegen/ehframe.cpp tools/nativegen/simd_c.cpp tools/nativegen/ngen.cpp \
            -o build/test_wrapper
          ./build/test_wrapper
      - name: Validate the game-code compile path for Android (NDK clang)
        run: |
          set -euo pipefail
          # The generated game code must compile for aarch64-linux-android. The NDK's clang (already
          # downloaded above) cross-compiles it; the on-device compiler (zig for Android) is a later
          # phase. A generated-code-like file: includes the runtime headers (as the generator emits
          # them, with -Iruntime) and uses the wide-screen patch's macros.
          TRIPLE=aarch64-linux-android24
          CC="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/$TRIPLE-clang"
          cat > /tmp/gencode_test.c <<'EOF'
          #include "cpu.h"
          #include "simd.h"
          void f_7000883064(Cpu *c) {
              extern float odyssey_wide(void);
              FP_SETS(8, VSF32(8) * odyssey_wide());
          }
          EOF
          mkdir -p build
          if ! $CC -O1 -fno-strict-aliasing -Wno-return-type -Wno-unused-label -fvisibility=hidden \
              -Iruntime -c /tmp/gencode_test.c -o /tmp/gencode_test.o 2>&1 | tee build/ndk.log; then
            echo "::error title=android ndk clang (end)::$(tail -n 40 build/ndk.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          file /tmp/gencode_test.o

  # Phase 2: the on-device C compiler. zig is the same compiler the PC builds use (runtime/gamebuild.c
  # runs `zig cc`); there is no official Android build, so build it for aarch64-linux-android with
  # zig-bootstrap (github.com/ziglang/zig-bootstrap - builds LLVM/Clang/LLD + zig for the target, all
  # from GitHub, no ziglang.org). Heavy (LLVM twice), so non-blocking and long timeout.
  zig-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
      - name: Cache zig-bootstrap build
        uses: actions/cache@v4
        with:
          path: /tmp/zig-bootstrap/out
          key: zig-bootstrap-0.15.2-aarch64-android
      - name: Build zig for aarch64-linux-android
        run: |
          set -euo pipefail
          ZIG=/tmp/zig-bootstrap/out/zig-aarch64-linux-android-baseline/zig
          if [ -x "$ZIG" ]; then
            echo "zig already built (cache hit): $ZIG"
            exit 0
          fi
          echo "CMAKE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          git clone --depth 1 --branch 0.15.2 https://github.com/ziglang/zig-bootstrap /tmp/zig-bootstrap
          cd /tmp/zig-bootstrap
          ./build aarch64-linux-android baseline 2>&1 | tee /tmp/zig-build.log
      - name: Verify the built zig (qemu-aarch64)
        run: |
          set -euo pipefail
          ZIG=/tmp/zig-bootstrap/out/zig-aarch64-linux-android-baseline/zig
          file "$ZIG"
          sudo apt-get install -y --no-install-recommends qemu-user-static
          qemu-aarch64-static "$ZIG" version
          printf 'int main(void){return 0;}\n' > /tmp/t.c
          qemu-aarch64-static "$ZIG" cc -target aarch64-linux-android -O1 /tmp/t.c -o /tmp/t
          file /tmp/t
          qemu-aarch64-static /tmp/t && echo "compiled binary runs under qemu"
      - name: Log on failure
        if: failure()
        run: |
          echo "::error title=zig for android build (end)::$(tail -n 60 /tmp/zig-build.log 2>/dev/null | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - name: Upload zig for Android
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zig-aarch64-android
          path: /tmp/zig-bootstrap/out/zig-aarch64-linux-android-baseline/zig

  # Phase 3: the minimal Android app (android/) - JNI over libnativegen, SAF file picker, and the
  # generate -> compile -> dlopen pipeline. Builds the debug APK. Depends on the zig-android job so
  # the on-device compiler (Phase 2) is bundled into the APK assets; the app extracts it on first run.
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    needs: zig-android
    steps:
      - uses: actions/checkout@v4
      - name: Download the on-device zig
        uses: actions/download-artifact@v4
        with:
          name: zig-aarch64-android
          path: /tmp/zig-android
          if-no-files-found: warn
      - name: Bundle zig into the APK assets
        run: |
          set -euo pipefail
          if [ -f /tmp/zig-android/zig ]; then
            mkdir -p android/app/src/main/assets/zig
            cp /tmp/zig-android/zig android/app/src/main/assets/zig/zig
            ls -la android/app/src/main/assets/zig/
          else
            echo "zig artifact missing - building APK without the on-device compiler"
          fi
      - name: Set up the Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Set up the Android NDK
        run: |
          curl -fsSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r27c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r27c" >> "$GITHUB_ENV"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the debug APK
        run: |
          cd android
          gradle assembleDebug --no-daemon
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
