# Windows build on a GitHub-hosted runner (direct internet; the Nexus proxy is only for local builds). The project
# has no Windows CI (the maintainer builds with make dist on his PC), so this adds it: a quick compile check of the
# runtime on every PR, and the full release zip (make dist: app + generator helper + zig + gamelib-src, no game
# code - the player builds that from their own files) on request (PR label "build-windows" or manual dispatch).
# The dist job below builds the full release zip on request (PR label "build-windows" or manual dispatch).
name: windows-build
on:
  pull_request:
    paths: ['runtime/**', 'Makefile', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish (e.g. 0.2.11). Empty = build only.'
        required: false
        type: string
permissions:
  contents: write

jobs:
  compile-check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: LF line endings (the bash tools break with CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-vulkan-validation-layers
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-binutils
            unzip
      - name: Compile the runtime
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p build
          make -j"$(nproc)" runtime-objs 2>&1 | tee build/check.log
      - name: Log on failure
        if: failure()
        shell: msys2 {0}
        run: |
          echo "::error title=windows build log (end)::$(tail -n 120 build/check.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"

  dist:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-windows')
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: LF line endings (the bash tools break with CRLF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-vulkan-devel
            mingw-w64-ucrt-x86_64-shaderc
            mingw-w64-ucrt-x86_64-spirv-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gdb
            mingw-w64-ucrt-x86_64-vulkan-memory-allocator
            mingw-w64-ucrt-x86_64-vulkan-validation-layers
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-binutils
            unzip
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: '3.12'
      - name: Ensure the MSYS2 license files dist_licenses.sh copies exist
        shell: msys2 {0}
        run: |
          set -euo pipefail
          U=/c/msys64/ucrt64/share/licenses
          # the MSYS2 packages ship no license files at the paths tools/dist_licenses.sh expects, so fetch each
          # from its source (the texts are stable: MIT, zlib, Apache 2.0, LGPL 2.1, GPL 3)
          fetch() { mkdir -p "$(dirname "$1")"; [ -f "$1" ] || curl -fsSL -o "$1" "$2"; }
          fetch "$U/VulkanMemoryAllocator/LICENSE" \
            https://raw.githubusercontent.com/GPUOpen-LibrariesAndSDKs/VulkanMemoryAllocator/v3.3.0/LICENSE.txt
          fetch "$U/sdl3/LICENSE.txt" \
            https://raw.githubusercontent.com/libsdl-org/SDL/release-3.4.20/LICENSE.txt
          fetch "$U/shaderc/LICENSE" \
            https://raw.githubusercontent.com/google/shaderc/v2026.3/LICENSE
          fetch "$U/llvm-libs/LICENSE" \
            https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-18.1.8/LICENSE.TXT
          fetch "$U/libwinpthread/COPYING" \
            https://raw.githubusercontent.com/mingw-w64/mingw-w64/master/mingw-w64-libraries/winpthreads/COPYING
          fetch "$U/libgcc/COPYING.RUNTIME" \
            https://raw.githubusercontent.com/gcc-mirror/gcc/master/COPYING.RUNTIME
          fetch "$U/libgcc/COPYING3" \
            https://raw.githubusercontent.com/gcc-mirror/gcc/master/COPYING3
          fetch "$U/libiconv/COPYING.LIB" \
            https://raw.githubusercontent.com/FFmpeg/FFmpeg/n9.0.2/COPYING.LGPLv2.1
          ls "$U"
      - name: Build the release zip
        shell: msys2 {0}
        run: |
          set -o pipefail
          mkdir -p build
          {
            # the MSYS2 shell's python is MSYS2's own (POSIX venv layout); the generator helper needs the Windows
            # python from setup-python (Scripts/python.exe venv layout, prebuilt unicorn/capstone wheels)
            PY="$(cygpath -u "${{ steps.py.outputs.python-path }}")"
            echo "PY=$PY"
            make deps-windows && make gen-helper PY312="$PY" && tools/fetch_zig.sh && make dist
          } 2>&1 | tee build/ci.log
      - name: Log on failure
        if: failure()
        shell: msys2 {0}
        run: |
          echo "::error title=windows build log (end)::$(tail -n 120 build/ci.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/dist/*.zip
      - name: Publish to release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $TAG = "v${{ github.event.inputs.version }}"
          # create the release if it does not exist yet (the linux job may create it first)
          gh release create $TAG --title "Power Moon Recomp ${{ github.event.inputs.version }}" --notes "Release ${{ github.event.inputs.version }}" 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host "create failed (may already exist)" }
          Get-ChildItem build/dist/*.zip | ForEach-Object {
            Write-Host "uploading $($_.FullName)"
            gh release upload $TAG $_.FullName --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
